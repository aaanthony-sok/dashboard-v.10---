    // would push the parser into quirks mode. DOMParser always emits a <head>

1; margin-top: 10px; margin-left: 192px; height: 16px; }\n.axis span { position: absolute; font-size: 11px; font-weight: 600; color: #8c87a0; white-space: nowrap; }\n@media (max-width: 1100px) {\n  .row-top { grid-template-columns: 1fr; }\n}\n\n@media (max-width: 768px) {\n  .page-shell { padding: 12px; }\n  .dash { padding: 18px 14px; border-radius: 18px; }\n  .loc-grid, .prac-grid { grid-template-columns: repeat(2, 1fr); }\n  .rows { grid-template-columns: 1fr; row-gap: 8px; }\n  .gridlines, .axis { display: none; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page-shell\">\n  <div class=\"dashboard-frame\">\n    <div class=\"dash\">\n    <div class=\"dash-title\">Performance Dashboard<\u002Fdiv>\n    <div class=\"row-top\">\n      <section class=\"widget loc-widget\">\n        <div class=\"w-head\">\n          <span class=\"w-ico\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fspan>\n          <div class=\"w-titles\">\n            <div class=\"w-title-line\"><span class=\"w-title\">Locations<\u002Fspan><span class=\"w-mtd\">(May 1, 2026 - May 31, 2026)<\u002Fspan><\u002Fdiv>\n            <div class=\"w-sub\">Performance analytics by location<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"loc-pills\" id=\"loc-pills\">\n          <button class=\"pill active\" onclick=\"setMetricLoc('jefferson', this)\">Jefferson City<\u002Fbutton>\n          <button class=\"pill inactive\" onclick=\"setMetricLoc('lake', this)\">Lake Ozark<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"loc-grid\" id=\"loc-grid\"><\u002Fdiv>\n        <div class=\"w-foot\">Total appointments&nbsp;<b>[<span id=\"loc-total\"><\u002Fspan>]<\u002Fb><\u0 "round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <div class=\"row-bottom\">\n      <section class=\"widget ranking-widget\">\n        <div class=\"w-head\">\n          <span class=\"w-ico\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20V10\"><\u002Fpath><path d=\"M18 20V4\"><\u002Fpath><path d=\"M6 20v-4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <div class=\"w-titles\">\n            <div class=\"w-title-line\"><span class=\"w-title\">Revenue Ranking<\u002Fspan><span class=\"w-mtd\">(May 1, 2026 - May 31, 2026)<\u002Fspan><\u002Fdiv>\n            <div class=\"w-sub\">Revenue by practitioner<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"chart\">\n          <div class=\"gridlines\" id=\"gridlines\"><\u002Fdiv>\n          <div class=\"rows\" id=\"rank-rows\"><\u002Fdiv>\n          <div class=\"axis\" id=\"rank-axis\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst REBOOK_DEF = \"Rebook Rate = Rebooked Appointments / Total Appointments Completed\\n\\nTo be counted as a 'rebooked' appointment, a client's appointment must meet these conditions:\\n•  main appointment completed\\n•  another appointment booked within 12 hours of main appointment start time (online or by front desk)\";\n\nconst locationMetrics = {\n  jefferson: [\n    { icon: 'dollar',   tint: 'purple', label: 'Gross Revenue', value: '$145,671', total: false },\n    { icon: 'wallet',   tint: 'teal',   label: 'Net Sales', value: '$94,432', total: false },\n    { icon: 'calendar', tint: 'purple', label: 'Appointments', value: '295', total: true },\n    { icon: 'tag',      tint: 'purple', label: 'Avg Ticket', value: '$421', total: false },\n    { icon: 'refresh',  tint: 'teal',   label: 'Rebook Rate', value: '68.3%', total: false, info: REBOOK_DEF },\n    { icon: 'bag',      tint: 'teal',   label: 'Retail Sales', value: '$12,043', total: false }\n  ],\n  lake: [\n    { icon: 'dollar',   tint: 'purple', label: 'Gross Revenue', value: '$397,539', total: false },\n    { icon: 'wallet',   tint: 'teal',   label: 'Net Sales', value: '$255,247', total: false },\n    { icon: 'calendar', tint: 'purple', label: 'Appointments', value: '818', total: true },\n    { icon: 'tag',      tint: 'purple', label: 'Avg Ticket', value: '$437', total: false },\n    { icon: 'refresh',  tint: 'teal',   label: 'Rebook Rate', value: '68.3%', total: false, info: REBOOK_DEF },\n    { icon: 'bag',      tint: 'teal',   label: 'Retail Sales', value: '$32,876', total: false }\n  ]\n};\n\nconst UTIL_DEF = \"Utilization Rate = Booked Hours / Available Hours\\n\\nThe share of a practitioner's available working hours that were filled with booked appointments during the period.\";\n\nconst practitioners = {\n  jefferson: [\n    { name: 'Admin Mann', initials: 'AM', color: 'purple', revenue: '$63,594', appts: '210', util: '88%' },\n    { name: 'Ashley LePage', initials: 'AL', color: 'teal', revenue: '$44,012', appts: '97', util: '81%' },\n    { name: 'Front Desk Jefferson City', initials: 'FD', color: 'purple', revenue: '$29,634', appts: '97', util: '76%' },\n    { name: 'Lindsey Eveler', initials: 'LE', color: 'teal', revenue: '$20,869', appts: '67', util: '72%' },\n    { name: 'Carley Drinkard', initials: 'CD', color: 'purple', revenue: '$18,702', appts: '46', util: '69%' },\n    { name: 'Taylor Cook', initials: 'TC', color: 'teal', revenue: '$13,060', appts: '60', util: '64%' },\n    { name: 'Olivia Allen', initials: 'OA', color: 'purple', revenue: '$5,608', appts: '4', util: '41%' }\n  ],\n  lake: [\n    { name: 'Front Desk Lake Ozark', initials: 'FD', color: 'purple', revenue: '$133,427', appts: '219', util: '90%' },\n    { name: 'Debra Atkinson', initials: 'DA', color: 'teal', revenue: '$94,261', appts: '127', util: '85%' },\n    { name: 'Brittany Quain', initials: 'BQ', color: 'purple', revenue: '$33,088', appts: '85', util: '78%' },\n    { name: 'Catherine Bear', initials: 'CB', color: 'teal', revenue: '$19,881', appts: '45', util: '70%' },\n    { name: 'Isabella Whelchel', initials: 'IW', color: 'purple', revenue: '$17,157', appts: '78', util: '74%' },\n    { name: 'Taylor Luebbering', initials: 'TL', color: 'teal', revenue: '$11,680', appts: '65', util: '66%' },\n    { name: 'Makayla Georgopoulos', initials: 'MG', color: 'purple', revenue: '$6,278', appts: '56', util: '58%' },\n    { name: 'Zeinap Imbraimova', initials: 'ZI', color: 'teal', revenue: '$552', appts: '5', util: '22%' }\n  ]\n};\n\n// Location label shown on ranking rows to disambiguate practitioners across sites.\nconst locationLabels = { jefferson: 'Jefferson City', lake: 'Lake Ozark' };\n\n// Built live from the practitioner data so the ranking never drifts.\n// Test practitioners are excluded and only the top 10 real practitioners are shown.\nfunction buildRanking() {\n  const parseMoney = (s) => Number(String(s).replace(/[^0-9.]/g, ''));\n  const all = [];\n  Object.keys(practitioners).forEach(loc => {\n    practitioners[loc].forEach(p => {\n      if (/test practitioner/i.test(p.name)) return;\n      all.push({ name: p.name, loc: locationLabels[loc], revenue: parseMoney(p.revenue) });\n    });\n  });\n  return all.sort((a, b) => b.revenue - a.revenue).slice(0, 10);\n}\nconst rankingData = buildRanking();\n\nlet currentMetricLoc = 'jefferson';\nlet currentPracLoc = 'jefferson';\nlet currentPracPage = 0;\nconst perPage = 6;\n\nconst METRIC_ICONS = {\n  dollar: '<path d=\"M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/>',\n  wallet: '<rect x=\"2.5\" y=\"6\" width=\"19\" height=\"13\" rx=\"3\"/><path d=\"M16 12h3.5M2.5 9.5h14\"/>',\n  calendar: '<rect x=\"3\" y=\"4.5\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M3 9h18M8 2.5v4M16 2.5v4\"/>',\n  tag: '<path d=\"M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z\"/><circle cx=\"7\" cy=\"7\" r=\"1.2\"/>',\n  refresh: '<polyline points=\"22 4 22 9.5 16.5 9.5\"/><polyline points=\"2 20 2 14.5 7.5 14.5\"/><path d=\"M4.2 9a8 8 0 0 1 13.3-3L22 9.5M2 14.5l4.5 3.5A8 8 0 0 0 19.8 15\"/>',\n  bag: '<path d=\"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z\"/><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"/><path d=\"M16 10a4 4 0 0 1-8 0\"/>'\n};\nfunction metricIcon(shape, tint) {\n  return `<span class=\"m-ico ${tint}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${METRIC_ICONS[shape]}<\u002Fsvg><\u002Fspan>`;\n}\n\nfunction renderMetrics(loc) {\n  const grid = document.getElementById('loc-grid');\n  const total = document.getElementById('loc-total');\n  grid.innerHTML = locationMetrics[loc].map(item => `\n    <div class=\"metric\">\n      ${metricIcon(item.icon, item.tint)}\n      <div class=\"m-body\">\n        <div class=\"m-lbl\">${item.label}${item.info ? `<span class=\"info\">?<span class=\"tip\">${item.info}<\u002Fspan><\u002Fspan>` : ''}<\u002Fdiv>\n        <div class=\"m-val\">${item.value}<\u002Fdiv>\n        ${item.delta ? `<div class=\"m-delta\">${item.delta} <span class=\"vs\">vs last month<\u002Fspan><\u002Fdiv>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  total.textContent = locationMetrics[loc].find(x => x.total).value;\n}\n\nfunction setMetricLoc(loc, el) {\n  currentMetricLoc = loc;\n  document.querySelectorAll('#loc-pills .pill').forEach(btn => btn.classList.remove('active'));\n  document.querySelectorAll('#loc-pills .pill').forEach(btn => btn.classList.add('inactive'));\n  el.classList.add('active');\n  el.classList.remove('inactive');\n  renderMetrics(loc);\n}\n\nfunction renderPractitioners() {\n  const list = practitioners[currentPracLoc];\n  const start = currentPracPage * perPage;\n  const items = list.slice(start, start + perPage);\n  const grid = document.getElementById('prac-grid');\n  grid.innerHTML = items.map(p => `\n    <div class=\"prac\">\n      <div class=\"prac-top\">\n        <div class=\"prac-av ${p.color}\">${p.initials}<\u002Fdiv>\n        <div class=\"prac-name\">${p.name}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prac-stats\">\n        <div class=\"prac-stat\"><span class=\"s-lbl\">Revenue<\u002Fspan><span class=\"s-val\">${p.revenue}<\u002Fspan><\u002Fdiv>\n        <div class=\"prac-stat\"><span class=\"s-lbl\">Appointments<\u002Fspan><span class=\"s-val\">${p.appts}<\u002Fspan><\u002Fdiv>\n        <div class=\"prac-stat\"><span class=\"s-lbl\">Utilization Rate <span class=\"info\">?<span class=\"tip\">${UTIL_DEF}<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"s-val\">${p.util}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n\n  while (items.length < perPage) {\n    grid.innerHTML += `\n      <div class=\"prac empty\">\n        <div class=\"prac-top\">\n          <div class=\"prac-av empty-av\">--<\u002Fdiv>\n          <div class=\"prac-name\">No practitioner<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"prac-stats\">\n          <div class=\"prac-stat\"><span class=\"s-lbl\">Revenue<\u002Fspan><span class=\"s-val\">--<\u002Fspan><\u002Fdiv>\n          <div class=\"prac-stat\"><span class=\"s-lbl\">Appointments<\u002Fspan><span class=\"s-val\">--<\u002Fspan><\u002Fdiv>\n          <div class=\"prac-stat\"><span class=\"s-lbl\">Utilization Rate<\u002Fspan><span class=\"s-val\">--<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n    items.push({});\n  }\n\n  const totalPages = Math.ceil(list.length / perPage);\n  document.getElementById('pg-info').textContent = `${currentPracPage + 1} / ${totalPages}`;\n  document.getElementById('pg-prev').disabled = currentPracPage === 0;\n  document.getElementById('pg-next').disabled = currentPracPage >= totalPages - 1;\n}\n\nfunction setPracLoc(loc, el) {\n  currentPracLoc = loc;\n  currentPracPage = 0;\n  document.querySelectorAll('#prac-pills .pill').forEach(btn => btn.classList.remove('active'));\n  document.querySelectorAll('#prac-pills .pill').forEach(btn => btn.classList.add('inactive'));\n  el.classList.add('active');\n  el.classList.remove('inactive');\n  renderPractitioners();\n}\n\nfunction pracPage(direction) {\n  const totalPages = Math.ceil(practitioners[currentPracLoc].length / perPage);\n  currentPracPage = Math.max(0, Math.min(totalPages - 1, currentPracPage + direction));\n  renderPractitioners();\n}\n\nfunction renderRanking() {\n  const max = Math.max(...rankingData.map(r => r.revenue));\n  \n  // Round max up to nearest $10,000\n  const scaledMax = Math.ceil(max / 10000) * 10000;\n  // Keep the axis readable: wider steps once the scale gets large.\n  const increment = scaledMax > 60000 ? 20000 : 10000;\n  const numSteps = scaledMax / increment;\n  \n  const rows = document.getElementById('rank-rows');\n  const axis = document.getElementById('rank-axis');\n  const grid = document.getElementById('gridlines');\n\n  rows.innerHTML = rankingData.map((r, i) => `\n    <div class=\"r-label\">\n      <span class=\"r-rank\">${i + 1}<\u002Fspan>\n      <span class=\"r-name\">${r.name}${r.loc ? `<span class=\"r-loc\">${r.loc}<\u002Fspan>` : ''}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"r-track\">\n      <div class=\"bar\" style=\"width:${(r.revenue / scaledMax) * 100}%\"><\u002Fdiv>\n      <span class=\"bar-val\">$${r.revenue.toLocaleString()}<\u002Fspan>\n    <\u002Fdiv>\n  `).join('');\n\n  axis.innerHTML = Array.from({ length: numSteps + 1 }, (_, i) => {\n    const val = increment * i;\n    const pct = (i / numSteps) * 100;\n    const tx = i === 0 ? '0' : (i === numSteps ? '-100%' : '-50%');\n    return `<span style=\"left:${pct}%; transform: translateX(${tx})\">$${val.toLocaleString()}<\u002Fspan>`;\n  }).join('');\n\n  grid.innerHTML = Array.from({ length: numSteps + 1 }, (_, i) => `<i style=\"left:${(i / numSteps) * 100}%\"><\u002Fi>`).join('');\n}\n\nrenderMetrics(currentMetricLoc);\nrenderPractitioners();\nrenderRanking();\n<\u002Fscript>\n\n<\u002Fdiv><\u002Fbody><\u002Fhtml>"
  </script>
